<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager</title>
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #333333;
      --text-muted: #666666;
      --border-color: #e0e0e0;
      --primary: #4a90e2;
      --primary-hover: #357abd;
      --danger: #e74c3c;
      --success: #2ecc71;
      --warning: #f1c40f;
      --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    [data-theme="dark"] {
      --bg-color: #1e1e2e;
      --card-bg: #2b2b3d;
      --text-color: #f5f5f5;
      --text-muted: #a0a0b0;
      --border-color: #3f3f5a;
      --shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); transition: background-color 0.3s, color 0.3s; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .theme-toggle { background: none; border: 1px solid var(--border-color); color: var(--text-color); padding: 8px 16px; border-radius: 20px; cursor: pointer; }

    .card { background: var(--card-bg); padding: 20px; border-radius: 8px; box-shadow: var(--shadow); margin-bottom: 20px; }
    
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; text-align: center; margin-bottom: 20px; }
    .stat-card { background: var(--card-bg); padding: 15px; border-radius: 8px; box-shadow: var(--shadow); }
    .stat-card h3 { font-size: 1.5rem; color: var(--primary); }
    .stat-card p { color: var(--text-muted); font-size: 0.9rem; }

    form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .full-width { grid-column: span 2; }
    input, select, button { padding: 10px; border: 1px solid var(--border-color); border-radius: 4px; background: var(--card-bg); color: var(--text-color); width: 100%; }
    button.btn-primary { background: var(--primary); color: white; border: none; cursor: pointer; font-weight: bold; }
    button.btn-primary:hover { background: var(--primary-hover); }

    .controls { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 10px; margin-bottom: 20px; }

    .task-list { list-style: none; }
    .task-item { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 6px; padding: 15px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; gap: 10px; transition: transform 0.1s; }
    .task-item.completed { opacity: 0.6; }
    .task-item.completed .task-title { text-decoration: line-through; }
    
    .task-info { flex-grow: 1; }
    .task-title { font-weight: bold; margin-bottom: 5px; display: block; }
    .task-meta { font-size: 0.85rem; color: var(--text-muted); display: flex; gap: 10px; flex-wrap: wrap; }
    
    .badge { padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; text-transform: uppercase; }
    .badge-low { background: #e3f2fd; color: #0d47a1; }
    .badge-medium { background: #fff3e0; color: #e65100; }
    .badge-high { background: #ffebee; color: #c62828; }

    .task-actions { display: flex; gap: 5px; }
    .action-btn { padding: 6px 10px; border: none; border-radius: 4px; cursor: pointer; }
    .btn-complete { background: var(--success); color: white; }
    .btn-edit { background: var(--warning); color: black; }
    .btn-delete { background: var(--danger); color: white; }

    .error-msg { color: var(--danger); font-size: 0.85rem; margin-top: -5px; margin-bottom: 5px; display: none; }

    @media (max-width: 600px) {
      form, .controls { grid-template-columns: 1fr; }
      .full-width { grid-column: span 1; }
      .task-item { flex-direction: column; align-items: flex-start; }
      .task-actions { width: 100%; justify-content: flex-end; margin-top: 10px; }
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Task Manager</h1>
    <button class="theme-toggle" id="themeToggleBtn">🌙 Dark Mode</button>
  </header>

  <div class="stats-grid">
    <div class="stat-card"><h3 id="statTotal">0</h3><p>Total Tasks</p></div>
    <div class="stat-card"><h3 id="statPending">0</h3><p>Pending</p></div>
    <div class="stat-card"><h3 id="statCompleted">0</h3><p>Completed</p></div>
  </div>

  <div class="card">
    <form id="taskForm">
      <input type="hidden" id="taskId">
      <div class="full-width">
        <input type="text" id="taskTitle" placeholder="Task Title *" required>
        <div class="error-msg" id="titleError">Title is required.</div>
      </div>
      <select id="taskCategory">
        <option value="General">General</option>
        <option value="Work">Work</option>
        <option value="Personal">Personal</option>
        <option value="Shopping">Shopping</option>
      </select>
      <select id="taskPriority">
        <option value="Low">Low Priority</option>
        <option value="Medium" selected>Medium Priority</option>
        <option value="High">High Priority</option>
      </select>
      <input type="date" id="taskDueDate">
      <button type="submit" class="btn-primary full-width" id="saveBtn">Add Task</button>
    </form>
  </div>

  <div class="controls">
    <input type="text" id="searchInput" placeholder="Search tasks...">
    <select id="filterStatus">
      <option value="all">All Status</option>
      <option value="pending">Pending</option>
      <option value="completed">Completed</option>
    </select>
    <select id="filterCategory">
      <option value="all">All Categories</option>
      <option value="General">General</option>
      <option value="Work">Work</option>
      <option value="Personal">Personal</option>
      <option value="Shopping">Shopping</option>
    </select>
  </div>

  <ul class="task-list" id="taskList"></ul>
</div>

<script>
  let tasks = JSON.parse(localStorage.getItem('tasks')) || [];
  let currentTheme = localStorage.getItem('theme') || 'light';

  const taskForm = document.getElementById('taskForm');
  const taskIdInput = document.getElementById('taskId');
  const taskTitleInput = document.getElementById('taskTitle');
  const taskCategoryInput = document.getElementById('taskCategory');
  const taskPriorityInput = document.getElementById('taskPriority');
  const taskDueDateInput = document.getElementById('taskDueDate');
  const saveBtn = document.getElementById('saveBtn');
  const taskList = document.getElementById('taskList');
  const searchInput = document.getElementById('searchInput');
  const filterStatus = document.getElementById('filterStatus');
  const filterCategory = document.getElementById('filterCategory');
  const themeToggleBtn = document.getElementById('themeToggleBtn');

  // Theme Handling
  document.documentElement.setAttribute('data-theme', currentTheme);
  themeToggleBtn.textContent = currentTheme === 'dark' ? '☀️ Light Mode' : '🌙 Dark Mode';

  themeToggleBtn.addEventListener('click', () => {
    currentTheme = currentTheme === 'light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', currentTheme);
    localStorage.setItem('theme', currentTheme);
    themeToggleBtn.textContent = currentTheme === 'dark' ? '☀️ Light Mode' : '🌙 Dark Mode';
  });

  // Save to LocalStorage & Render
  function saveAndRender() {
    localStorage.setItem('tasks', JSON.stringify(tasks));
    renderTasks();
    updateStats();
  }

  function updateStats() {
    const total = tasks.length;
    const completed = tasks.filter(t => t.completed).length;
    const pending = total - completed;

    document.getElementById('statTotal').textContent = total;
    document.getElementById('statCompleted').textContent = completed;
    document.getElementById('statPending').textContent = pending;
  }

  // Add / Edit Task
  taskForm.addEventListener('submit', (e) => {
    e.preventDefault();

    const title = taskTitleInput.value.trim();
    if (!title) {
      document.getElementById('titleError').style.display = 'block';
      return;
    }
    document.getElementById('titleError').style.display = 'none';

    const id = taskIdInput.value;
    if (id) {
      // Edit mode
      tasks = tasks.map(t => t.id === id ? {
        ...t,
        title,
        category: taskCategoryInput.value,
        priority: taskPriorityInput.value,
        dueDate: taskDueDateInput.value
      } : t);
      saveBtn.textContent = 'Add Task';
    } else {
      // Add mode
      const newTask = {
        id: Date.now().toString(),
        title,
        category: taskCategoryInput.value,
        priority: taskPriorityInput.value,
        dueDate: taskDueDateInput.value,
        completed: false
      };
      tasks.push(newTask);
    }

    taskForm.reset();
    taskIdInput.value = '';
    saveAndRender();
  });

  // Toggle Complete
  function toggleComplete(id) {
    tasks = tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
    saveAndRender();
  }

  // Delete Task
  function deleteTask(id) {
    tasks = tasks.filter(t => t.id !== id);
    saveAndRender();
  }

  // Edit Mode Setup
  function editTask(id) {
    const task = tasks.find(t => t.id === id);
    if (!task) return;

    taskIdInput.value = task.id;
    taskTitleInput.value = task.title;
    taskCategoryInput.value = task.category;
    taskPriorityInput.value = task.priority;
    taskDueDateInput.value = task.dueDate;
    saveBtn.textContent = 'Update Task';
  }

  // Render Task List with Filters and Search
  function renderTasks() {
    taskList.innerHTML = '';

    const query = searchInput.value.toLowerCase();
    const statusFilter = filterStatus.value;
    const categoryFilter = filterCategory.value;

    const filtered = tasks.filter(task => {
      const matchesSearch = task.title.toLowerCase().includes(query);
      const matchesStatus = statusFilter === 'all' || 
        (statusFilter === 'completed' && task.completed) || 
        (statusFilter === 'pending' && !task.completed);
      const matchesCategory = categoryFilter === 'all' || task.category === categoryFilter;

      return matchesSearch && matchesStatus && matchesCategory;
    });

    if (filtered.length === 0) {
      taskList.innerHTML = '<li style="text-align: center; color: var(--text-muted); padding: 20px;">No tasks found.</li>';
      return;
    }

    filtered.forEach(task => {
      const li = document.createElement('li');
      li.className = `task-item ${task.completed ? 'completed' : ''}`;
      
      const badgeClass = `badge-${task.priority.toLowerCase()}`;

      li.innerHTML = `
        <div class="task-info">
          <span class="task-title">${escapeHTML(task.title)}</span>
          <div class="task-meta">
            <span>📁 ${task.category}</span>
            <span class="badge ${badgeClass}">${task.priority}</span>
            ${task.dueDate ? `<span>📅 ${task.dueDate}</span>` : ''}
          </div>
        </div>
        <div class="task-actions">
          <button class="action-btn btn-complete" onclick="toggleComplete('${task.id}')">
            ${task.completed ? 'Undo' : 'Done'}
          </button>
          <button class="action-btn btn-edit" onclick="editTask('${task.id}')">Edit</button>
          <button class="action-btn btn-delete" onclick="deleteTask('${task.id}')">Delete</button>
        </div>
      `;
      taskList.appendChild(li);
    });
  }

  function escapeHTML(str) {
    return str.replace(/[&<>'"]/g, 
      tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
    );
  }

  // Event Listeners for Live Filtering
  searchInput.addEventListener('input', renderTasks);
  filterStatus.addEventListener('change', renderTasks);
  filterCategory.addEventListener('change', renderTasks);

  // Initial Load
  saveAndRender();
</script>
</body>
</html>

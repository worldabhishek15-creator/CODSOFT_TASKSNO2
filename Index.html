<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Professional responsive task management dashboard with local storage.">
  <title>TaskFlow — Task Manager</title>
  <style>
    /* ----- reset & variables ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background 0.2s, color 0.2s;
    }
    :root {
      --bg: #f5f7fb;
      --surface: #ffffff;
      --surface2: #f8fafc;
      --text: #172033;
      --muted: #667085;
      --border: #e6eaf0;
      --primary: #5b5ce2;
      --primary2: #7c3aed;
      --danger: #dc3545;
      --success: #16a34a;
      --warning: #d97706;
      --shadow: 0 12px 35px rgba(16, 24, 40, 0.08);
      --radius: 14px;
    }
    body.dark {
      --bg: #0d1117;
      --surface: #151b23;
      --surface2: #10161e;
      --text: #f1f5f9;
      --muted: #98a2b3;
      --border: #263241;
      --shadow: 0 12px 35px rgba(0, 0, 0, 0.25);
    }
    button, input, select, textarea {
      font: inherit;
    }
    button {
      cursor: pointer;
      border: 0;
      background: none;
    }

    /* ----- app layout ----- */
    .app {
      display: flex;
      min-height: 100vh;
    }

    /* ----- sidebar ----- */
    .sidebar {
      width: 250px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 26px 18px;
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      transition: background 0.2s, border 0.2s;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 11px;
      font-weight: 800;
      font-size: 20px;
      margin: 0 10px 34px;
    }
    .logo-icon {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      background: linear-gradient(135deg, var(--primary), var(--primary2));
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 700;
    }
    .nav-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      padding: 0 12px 10px;
    }
    .nav button {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      background: transparent;
      color: var(--muted);
      padding: 12px;
      border-radius: 10px;
      text-align: left;
      margin: 3px 0;
      transition: 0.15s;
    }
    .nav button.active,
    .nav button:hover {
      background: rgba(91, 92, 226, 0.1);
      color: var(--primary);
    }
    .sidebar-bottom {
      margin-top: auto;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }
    .theme-btn {
      width: 100%;
      padding: 11px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      border-radius: 10px;
      transition: 0.2s;
    }

    /* ----- main area ----- */
    .main {
      margin-left: 250px;
      width: calc(100% - 250px);
      padding: 30px;
      max-width: 1600px;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }
    .title h1 {
      font-size: 28px;
      letter-spacing: -0.03em;
    }
    .title p {
      color: var(--muted);
      margin-top: 5px;
      font-size: 14px;
    }
    .add-btn {
      background: linear-gradient(135deg, var(--primary), var(--primary2));
      color: #fff;
      padding: 12px 18px;
      border-radius: 10px;
      font-weight: 700;
      box-shadow: 0 8px 20px rgba(91, 92, 226, 0.22);
      transition: 0.2s;
      white-space: nowrap;
    }
    .add-btn:hover {
      transform: scale(1.02);
      box-shadow: 0 10px 28px rgba(91, 92, 226, 0.3);
    }

    /* ----- stats ----- */
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 22px;
    }
    .stat {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 19px;
      box-shadow: var(--shadow);
      transition: 0.2s;
    }
    .stat-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--muted);
      font-size: 13px;
    }
    .stat-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--surface2);
      display: grid;
      place-items: center;
    }
    .stat h2 {
      font-size: 27px;
      margin-top: 13px;
      font-weight: 700;
    }
    .stat small {
      color: var(--muted);
    }

    /* ----- toolbar ----- */
    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 13px;
      border-radius: var(--radius);
      margin-bottom: 20px;
      box-shadow: var(--shadow);
      flex-wrap: wrap;
    }
    .search {
      flex: 1;
      position: relative;
      min-width: 140px;
    }
    .search span {
      position: absolute;
      left: 13px;
      top: 10px;
      color: var(--muted);
    }
    .search input {
      width: 100%;
      padding: 10px 12px 10px 37px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--surface2);
      color: var(--text);
      outline: none;
      transition: 0.15s;
    }
    .search input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(91, 92, 226, 0.1);
    }
    .toolbar select {
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--surface2);
      color: var(--text);
      outline: none;
      min-width: 120px;
      transition: 0.15s;
    }
    .toolbar select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(91, 92, 226, 0.1);
    }

    /* ----- task list ----- */
    .tasks-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .tasks-header h2 {
      font-size: 18px;
    }
    .count {
      font-size: 13px;
      color: var(--muted);
    }
    .task-list {
      display: grid;
      gap: 12px;
    }
    .task {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 17px;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: 0.2s;
      box-shadow: 0 5px 20px rgba(16, 24, 40, 0.04);
    }
    .task:hover {
      transform: translateY(-1px);
      box-shadow: var(--shadow);
    }
    .check {
      width: 22px;
      height: 22px;
      border: 2px solid #c8ced8;
      border-radius: 7px;
      background: transparent;
      flex: none;
      display: grid;
      place-items: center;
      color: #fff;
      transition: 0.15s;
    }
    .task.completed .check {
      background: var(--success);
      border-color: var(--success);
    }
    .task.completed .check:after {
      content: "✓";
      font-size: 13px;
    }
    .task-body {
      flex: 1;
      min-width: 0;
    }
    .task-title {
      font-weight: 700;
      font-size: 15px;
      word-break: break-word;
    }
    .task.completed .task-title {
      text-decoration: line-through;
      color: var(--muted);
    }
    .task-desc {
      font-size: 13px;
      color: var(--muted);
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 9px;
    }
    .badge {
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 999px;
      font-weight: 700;
    }
    .category {
      background: rgba(91, 92, 226, 0.1);
      color: var(--primary);
    }
    .low {
      background: #ecfdf3;
      color: #15803d;
    }
    .medium {
      background: #fff7ed;
      color: #c2410c;
    }
    .high {
      background: #fef2f2;
      color: #b91c1c;
    }
    .due {
      background: var(--surface2);
      color: var(--muted);
    }
    body.dark .low {
      background: #103a27;
      color: #4ade80;
    }
    body.dark .medium {
      background: #3b2814;
      color: #fbbf24;
    }
    body.dark .high {
      background: #401c20;
      color: #f87171;
    }
    .actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }
    .icon-btn {
      width: 35px;
      height: 35px;
      border-radius: 9px;
      background: var(--surface2);
      color: var(--muted);
      transition: 0.15s;
      display: grid;
      place-items: center;
    }
    .icon-btn:hover {
      color: var(--primary);
      background: rgba(91, 92, 226, 0.08);
    }
    .delete:hover {
      color: var(--danger);
    }
    .empty {
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      text-align: center;
      padding: 55px 20px;
      color: var(--muted);
    }
    .empty strong {
      display: block;
      color: var(--text);
      margin-bottom: 6px;
    }

    /* ----- modal / overlay ----- */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.5);
      display: none;
      place-items: center;
      padding: 18px;
      z-index: 50;
      backdrop-filter: blur(2px);
    }
    .overlay.show {
      display: grid;
    }
    .modal {
      width: min(560px, 100%);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 23px;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.2);
      animation: modalIn 0.2s ease;
    }
    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }
    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .modal-head h2 {
      font-size: 20px;
    }
    .close {
      background: transparent;
      color: var(--muted);
      font-size: 26px;
      line-height: 1;
    }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .field.full {
      grid-column: 1 / -1;
    }
    .field label {
      font-size: 12px;
      font-weight: 700;
      display: block;
      margin-bottom: 7px;
      color: var(--text);
    }
    .field input,
    .field textarea,
    .field select {
      width: 100%;
      padding: 11px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--surface2);
      color: var(--text);
      outline: none;
      transition: 0.15s;
    }
    .field textarea {
      resize: vertical;
      min-height: 85px;
    }
    .field input:focus,
    .field textarea:focus,
    .field select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(91, 92, 226, 0.1);
    }
    .error {
      color: var(--danger);
      font-size: 12px;
      margin-top: 5px;
      display: none;
    }
    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }
    .cancel {
      background: var(--surface2);
      color: var(--text);
      padding: 11px 16px;
      border-radius: 9px;
      border: 1px solid var(--border);
    }
    .save {
      background: var(--primary);
      color: #fff;
      padding: 11px 18px;
      border-radius: 9px;
      font-weight: 700;
      transition: 0.15s;
    }
    .save:hover {
      background: var(--primary2);
    }

    /* ----- toast ----- */
    .toast {
      position: fixed;
      right: 22px;
      bottom: 22px;
      background: #172033;
      color: #fff;
      padding: 12px 16px;
      border-radius: 10px;
      box-shadow: var(--shadow);
      transform: translateY(20px);
      opacity: 0;
      pointer-events: none;
      transition: 0.25s;
      z-index: 80;
      font-size: 13px;
    }
    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* ----- mobile nav ----- */
    .mobile-nav {
      display: none;
    }

    /* ----- responsive ----- */
    @media (max-width: 1000px) {
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    @media (max-width: 720px) {
      .sidebar {
        display: none;
      }
      .main {
        margin-left: 0;
        width: 100%;
        padding: 20px 15px 85px;
      }
      .topbar {
        align-items: flex-start;
      }
      .title h1 {
        font-size: 23px;
      }
      .add-btn {
        padding: 10px 13px;
        font-size: 13px;
      }
      .toolbar {
        flex-wrap: wrap;
      }
      .search {
        flex-basis: 100%;
      }
      .toolbar select {
        flex: 1;
        min-width: 0;
      }
      .task {
        align-items: flex-start;
      }
      .actions {
        flex-direction: column;
        gap: 4px;
      }
      .stats {
        gap: 10px;
      }
      .stat {
        padding: 14px;
      }
      .stat h2 {
        font-size: 22px;
      }
      .stat-icon {
        display: none;
      }
      .form-grid {
        grid-template-columns: 1fr;
      }
      .field.full {
        grid-column: auto;
      }
      .mobile-nav {
        display: flex;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        height: 62px;
        background: var(--surface);
        border-top: 1px solid var(--border);
        z-index: 30;
        justify-content: space-around;
        align-items: center;
      }
      .mobile-nav button {
        background: none;
        color: var(--muted);
        font-size: 20px;
        padding: 8px 14px;
        border-radius: 30px;
        transition: 0.15s;
      }
      .mobile-nav button.active {
        color: var(--primary);
        background: rgba(91, 92, 226, 0.08);
      }
    }
  </style>
</head>
<body>

<div class="app">
  <!-- sidebar -->
  <aside class="sidebar">
    <div class="logo">
      <div class="logo-icon">✓</div>
      TaskFlow
    </div>
    <div class="nav-title">Workspace</div>
    <div class="nav">
      <button class="active" data-view="all">▦ <span>All Tasks</span></button>
      <button data-view="pending">◷ <span>Pending</span></button>
      <button data-view="completed">✓ <span>Completed</span></button>
    </div>
    <div class="sidebar-bottom">
      <button class="theme-btn" id="themeBtn">☾ &nbsp; Dark Mode</button>
    </div>
  </aside>

  <!-- main -->
  <main class="main">
    <div class="topbar">
      <div class="title">
        <h1>Good day 👋</h1>
        <p>Stay organized and get things done.</p>
      </div>
      <button class="add-btn" id="addBtn">＋ Add Task</button>
    </div>

    <section class="stats">
      <div class="stat"><div class="stat-top"><span>Total Tasks</span><div class="stat-icon">▦</div></div><h2 id="total">0</h2><small>All your tasks</small></div>
      <div class="stat"><div class="stat-top"><span>Completed</span><div class="stat-icon">✓</div></div><h2 id="completed">0</h2><small>Tasks finished</small></div>
      <div class="stat"><div class="stat-top"><span>Pending</span><div class="stat-icon">◷</div></div><h2 id="pending">0</h2><small>Tasks remaining</small></div>
      <div class="stat"><div class="stat-top"><span>Overdue</span><div class="stat-icon">!</div></div><h2 id="overdue">0</h2><small>Need attention</small></div>
    </section>

    <section class="toolbar">
      <div class="search"><span>⌕</span><input id="search" type="search" placeholder="Search tasks..."></div>
      <select id="statusFilter"><option value="all">All Status</option><option value="pending">Pending</option><option value="completed">Completed</option></select>
      <select id="priorityFilter"><option value="all">All Priority</option><option value="high">High</option><option value="medium">Medium</option><option value="low">Low</option></select>
      <select id="categoryFilter"><option value="all">All Categories</option></select>
    </section>

    <div class="tasks-header"><h2>My Tasks</h2><span class="count" id="visibleCount">0 tasks</span></div>
    <section class="task-list" id="taskList"></section>
  </main>
</div>

<!-- mobile nav -->
<nav class="mobile-nav">
  <button class="active" data-view="all">▦</button>
  <button data-view="pending">◷</button>
  <button data-view="completed">✓</button>
  <button id="mobileTheme">☾</button>
</nav>

<!-- overlay modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-head"><h2 id="modalTitle">Add New Task</h2><button class="close" id="closeModal">×</button></div>
    <form id="taskForm" novalidate>
      <input type="hidden" id="editId">
      <div class="form-grid">
        <div class="field full"><label for="taskTitle">Task title *</label><input id="taskTitle" maxlength="80" placeholder="e.g. Complete project presentation"><div class="error" id="titleError">Please enter a task title.</div></div>
        <div class="field full"><label for="taskDesc">Description</label><textarea id="taskDesc" maxlength="250" placeholder="Add some details..."></textarea></div>
        <div class="field"><label for="category">Category</label><select id="category"><option>Work</option><option>Personal</option><option>Study</option><option>Health</option><option>Shopping</option><option>Other</option></select></div>
        <div class="field"><label for="priority">Priority</label><select id="priority"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option></select></div>
        <div class="field"><label for="dueDate">Due date</label><input id="dueDate" type="date"></div>
      </div>
      <div class="form-actions"><button type="button" class="cancel" id="cancelBtn">Cancel</button><button class="save" type="submit">Save Task</button></div>
    </form>
  </div>
</div>

<!-- toast -->
<div class="toast" id="toast"></div>

<script>
  (function() {
    const KEY = 'taskflow_tasks_v1';
    const THEME_KEY = 'taskflow_theme';

    // ----- state -----
    let tasks = JSON.parse(localStorage.getItem(KEY) || '[]');
    let currentView = 'all';
    let editingId = null;

    // ----- dom refs -----
    const $ = id => document.getElementById(id);
    const taskList = $('taskList');
    const searchInput = $('search');
    const statusFilter = $('statusFilter');
    const priorityFilter = $('priorityFilter');
    const categoryFilter = $('categoryFilter');
    const overlay = $('overlay');
    const modalTitle = $('modalTitle');
    const taskForm = $('taskForm');
    const editIdInput = $('editId');
    const taskTitle = $('taskTitle');
    const taskDesc = $('taskDesc');
    const categorySelect = $('category');
    const prioritySelect = $('priority');
    const dueDateInput = $('dueDate');
    const titleError = $('titleError');
    const toastEl = $('toast');
    const addBtn = $('addBtn');
    const closeModalBtn = $('closeModal');
    const cancelBtn = $('cancelBtn');

    // ----- helpers -----
    function save() {
      localStorage.setItem(KEY, JSON.stringify(tasks));
    }
    function uid() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    }
    function escapeHTML(s) {
      if (!s) return '';
      return String(s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
    }
    function formatDate(d) {
      if (!d) return '';
      return new Date(d + 'T00:00:00').toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
    }
    function isOverdue(task) {
      if (!task.dueDate || task.completed) return false;
      const due =
